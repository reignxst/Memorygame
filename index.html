<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Question Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="header">
  <h1>🃏 Memory Challenge</h1>
  <p>Match the cards, answer the question, steal the win!</p>
</div>

<div class="container">

  <div class="team team1" id="teamPanel1">
    <div class="turn-badge">YOUR TURN</div>
    <h2 id="team1Name">Team 1</h2>
    <div class="avatar">🤖</div>
    <div class="preview" id="team1Preview">
      <span class="preview-placeholder">🃏</span>
    </div>
    <div class="score-label">SCORE</div>
    <div class="score-display" id="score1">0</div>
  </div>

  <div class="board" id="board"></div>

  <div class="team team2" id="teamPanel2">
    <div class="turn-badge">YOUR TURN</div>
    <h2 id="team2Name">Team 2</h2>
    <div class="avatar">👾</div>
    <div class="preview" id="team2Preview">
      <span class="preview-placeholder">🃏</span>
    </div>
    <div class="score-label">SCORE</div>
    <div class="score-display" id="score2">0</div>
  </div>

</div>

<div class="bottom-bar">
  <button class="btn btn-settings" id="settingsBtn">⚙ Settings</button>
  <div class="turn-text" id="turnDisplay">Current Turn: <span>Team 1</span></div>
  <button class="btn btn-reset" id="resetBtn">↻ Reset</button>
</div>

<!-- ─── QUESTION MODAL ─── -->
<div class="modal hidden" id="questionModal">
  <div class="modal-box">
    <div class="steal-banner" id="stealBanner">🔥 STEAL CHANCE!</div>
    <div class="q-header" id="qHeader">Team 1's Turn</div>
    <img class="q-image" id="qImage" src="" alt="card image">
    <p id="questionText"></p>
    <div class="attempt-tracker">
      <span class="attempt-label">Attempts:</span>
      <div id="attemptDots"></div>
    </div>
    <div class="choices" id="choicesGrid"></div>
  </div>
</div>

<!-- ─── WINNER MODAL ─── -->
<div class="modal hidden" id="winnerModal">
  <div class="modal-box">
    <div class="winner-trophy" id="winnerTrophy">🏆</div>
    <div class="winner-text" id="winnerText">Team 1 Wins!</div>
    <div class="winner-scores" id="winnerScores"></div>
    <button class="btn-play-again" onclick="location.reload()">🎮 Play Again</button>
  </div>
</div>

<!-- ─── SETTINGS MODAL ─── -->
<div class="modal hidden" id="settingsModal">
  <div class="modal-box">
    <h2>⚙ Settings</h2>
    <div class="setting-group">
      <label>Team 1 Name</label>
      <input type="text" id="setTeam1" placeholder="Team 1">
    </div>
    <div class="setting-group">
      <label>Team 2 Name</label>
      <input type="text" id="setTeam2" placeholder="Team 2">
    </div>
    <div class="setting-group">
      <label>Points per Correct Answer</label>
      <select id="setPoints">
        <option value="1">1 point</option>
        <option value="3" selected>3 points</option>
        <option value="5">5 points</option>
        <option value="10">10 points</option>
      </select>
    </div>
    <div class="settings-btns">
      <button class="btn btn-save" onclick="saveSettings()">💾 Save</button>
      <button class="btn btn-cancel-s" onclick="closeSettings()">✕ Cancel</button>
    </div>
  </div>
</div>

<!-- CDN library for confetti effect -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<!-- Game logic -->
<script src="script.js"></script>

</body>
</html>
